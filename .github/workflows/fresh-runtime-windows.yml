name: Fresh Windows runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Windows release version
        required: true
        default: '0.6.15'
      build_run:
        description: Optional signed candidate build run for this exact commit
        required: false
        default: ''
      unicode_paths:
        description: Test storage and TEMP paths containing Chinese and spaces
        type: boolean
        default: true
      offline_repair:
        description: Test a new local-rule repair instead of replaying the published candidate
        type: boolean
        default: false
      review_input:
        description: Optional version-specific fixed replay files from the F01 review ZIP
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  prepare-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore the exact review inputs
        if: ${{ inputs.review_input != '' }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_BUILD_RUN: ${{ inputs.build_run }}
          OFFLINE_REPAIR: ${{ inputs.offline_repair }}
        run: |
          if ($env:CANDIDATE_BUILD_RUN -or $env:OFFLINE_REPAIR -eq 'true') {
            throw 'Use the official published release for the review inputs'
          }
          $review = Join-Path $env:RUNNER_TEMP 'F01 评审复核 输入'
          python -X utf8 tools/prepare_review_handoff_probe.py --restore $review --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Review replay inputs did not match the version receipt' }
          "F01_REVIEW_INPUTS=$review" >> $env:GITHUB_ENV
      - name: Download the published Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_BUILD_RUN: ${{ inputs.build_run }}
        run: |
          New-Item -ItemType Directory inputs,evidence | Out-Null
          if ($env:F01_REVIEW_INPUTS) {
            $reviewDesktop = Join-Path $env:F01_REVIEW_INPUTS 'Windows桌面版'
            $shell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            & $shell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $reviewDesktop '下载并校验安装包.ps1')
            if ($LASTEXITCODE -ne 0) { throw 'Review ZIP installer download failed' }
            Copy-Item -LiteralPath (Join-Path $reviewDesktop 'latest.json'),(Join-Path $reviewDesktop 'latest.json.sig'),(Join-Path $reviewDesktop 'Lazarus-Agent-windows-x64-setup.exe') -Destination inputs
            Copy-Item -LiteralPath (Join-Path $env:F01_REVIEW_INPUTS 'review-inputs.json') -Destination evidence/review-inputs.json
          } else {
            .\tools\fetch_windows_review_input.ps1 -Version $env:RELEASE_VERSION -BuildRun $env:CANDIDATE_BUILD_RUN -Commit $env:GITHUB_SHA
          }
          $manifest = Get-Content -Raw inputs/latest.json | ConvertFrom-Json
          $asset = $manifest.assets.'windows-x64-installer'
          if ($manifest.version -ne $env:RELEASE_VERSION -or
              (Get-FileHash inputs/Lazarus-Agent-windows-x64-setup.exe).Hash.ToLowerInvariant() -ne $asset.sha256) {
            throw 'Installer version or SHA mismatch'
          }
          Copy-Item inputs/latest.json evidence/release-manifest.json
          Copy-Item inputs/latest.json.sig evidence/release-manifest.sig
          @{ source_build_run=$env:CANDIDATE_BUILD_RUN; source_commit=$env:GITHUB_SHA } |
            ConvertTo-Json | Set-Content -Encoding utf8 evidence/build-source.json
      - name: First use through the installed desktop program
        shell: pwsh
        env:
          UNICODE_PATHS: ${{ inputs.unicode_paths }}
          OFFLINE_REPAIR: ${{ inputs.offline_repair }}
        run: |
          if ($env:OFFLINE_REPAIR -eq 'true') {
            $clientPython = (Get-Command python -CommandType Application | Select-Object -First 1).Source
            & $clientPython --version
            if ($LASTEXITCODE -ne 0) { throw 'Offline repair client interpreter could not start' }
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:JAVA_HOME = ''
          $env:ANDROID_HOME = ''
          $env:ANDROID_SDK_ROOT = ''
          $env:REVIVER_SDK = ''
          $env:REVIVER_JAVA_HOME = ''
          $env:REVIVER_LAB = ''
          $env:REVIVER_MODEL_URL = ''
          $env:REVIVER_MODEL = ''
          $env:REVIVER_MODEL_KEY = ''
          $env:REVIVER_PORT = '18786'
          $env:LAZARUS_STORAGE_ROOT = Join-Path $env:RUNNER_TEMP 'lazarus-first-runtime'
          if ($env:UNICODE_PATHS -eq 'true') {
            $env:LAZARUS_STORAGE_ROOT = Join-Path $env:RUNNER_TEMP 'lazarus-first-runtime-中文 验证'
            $env:TEMP = Join-Path $env:RUNNER_TEMP '中文临时 目录'
            $env:TMP = $env:TEMP
            New-Item -ItemType Directory -Path $env:TEMP | Out-Null
          }
          if (Test-Path -LiteralPath $env:LAZARUS_STORAGE_ROOT) { throw 'Storage root was not clean' }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Lazarus Agent\Lazarus-Agent.exe'
          if ($env:F01_REVIEW_INPUTS -and (Test-Path -LiteralPath $app)) { throw 'Review installation path was not clean' }
          $setup = Start-Process -FilePath .\inputs\Lazarus-Agent-windows-x64-setup.exe -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          $desktop = Start-Process -FilePath $app -WindowStyle Hidden -PassThru
          try {
            $base = 'http://127.0.0.1:18786'
            $deadline = (Get-Date).AddMinutes(3)
            $config = $null
            while ((Get-Date) -lt $deadline) {
              try { $config = Invoke-RestMethod "$base/api/config"; break } catch {}
              if ($desktop.HasExited) { throw 'Desktop exited before starting its local service' }
              Start-Sleep -Seconds 2
            }
            if (!$config) { throw 'Desktop local service did not start' }
            $headers = @{'x-reviver-token'=$config.token; Origin=$base}
            $before = Invoke-RestMethod "$base/api/runtime"
            $before | ConvertTo-Json -Depth 14 | Set-Content -Encoding utf8 evidence/before.json
            if ($before.targets.'36'.ready) { throw 'Target was unexpectedly prepared before the test' }
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $deadline = (Get-Date).AddMinutes(20)
            for ($prepareAttempt = 1; $prepareAttempt -le 3; $prepareAttempt++) {
              $started = Invoke-RestMethod "$base/api/runtime/prepare" -Method Post -Headers $headers -ContentType 'application/json' -Body '{"targets":[36],"accept_terms":true}'
              if (!$started.started -and !$started.ready) { throw 'Preparation did not start' }
              $events = [Collections.Generic.HashSet[string]]::new()
              do {
                $state = Invoke-RestMethod "$base/api/runtime"
                foreach ($event in $state.active.events) {
                  $row = $event | ConvertTo-Json -Compress
                  if ($events.Add($row)) { Add-Content -Encoding utf8 evidence/events.jsonl $row }
                }
                $state | ConvertTo-Json -Depth 16 | Set-Content -Encoding utf8 evidence/latest.json
                if ($state.active.status -ne 'running') { break }
                Start-Sleep -Seconds 5
              } while ((Get-Date) -lt $deadline)
              Copy-Item evidence/latest.json "evidence/prepare-attempt-$prepareAttempt.json"
              if ($state.targets.'36'.ready) { break }
              if ($state.active.status -ne 'error' -or $state.active.message -notmatch 'HTTP Error 50[234]:|\[WinError 10060\]|\btimed out\b' -or
                  $prepareAttempt -eq 3 -or (Get-Date) -ge $deadline) {
                throw "Preparation failed ($($state.active.status)): $($state.active.message)"
              }
              Write-Warning "Runtime preparation attempt $prepareAttempt ended with $($state.active.message). Retrying with the same cache."
              Start-Sleep -Seconds 8
            }
            $clock.Stop()
            if (!$state.targets.'36'.ready -or $state.active.status -eq 'running') { throw 'Runtime preparation did not finish' }
            $cached = Invoke-RestMethod "$base/api/runtime/prepare" -Method Post -Headers $headers -ContentType 'application/json' -Body '{"targets":[36],"accept_terms":true}'
            if ($cached.started -or !$cached.ready) { throw 'Prepared runtime was not reused' }
            $cached | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 evidence/reuse.json
            $runtime = Join-Path $env:LAZARUS_STORAGE_ROOT 'runtimes\android-lab'
            $emulator = Join-Path $runtime 'lab-sdk\emulator\emulator.exe'
            $accel = & $emulator -accel-check 2>&1
            $accel | Set-Content -Encoding utf8 evidence/acceleration.txt
            $offlineRules = @()
            try {
              $programs = @($app, (Join-Path $runtime 'java\bin\java.exe'), (Join-Path $runtime 'lab-sdk\platform-tools\adb.exe'), $emulator)
              $index = 0
              foreach ($program in $programs) {
                $name = "Lazarus-offline-$index"
                New-NetFirewallRule -DisplayName $name -Direction Outbound -Program $program -Action Block -RemoteAddress Internet | Out-Null
                $offlineRules += $name
                $index++
              }
              $check = if ($env:OFFLINE_REPAIR -eq 'true') { 'local-rule' } else { 'candidate-replay' }
              @{ app=$app; programs=$programs; outbound='Internet blocked per executable, loopback retained'; check=$check } |
                ConvertTo-Json | Set-Content -Encoding utf8 evidence/offline.json
              $verificationExit = $null
              if ($check -eq 'local-rule') {
                if ((Invoke-RestMethod "$base/api/config").model) { throw 'Model must be disabled for the local-rule test' }
                & $clientPython -X utf8 tools/repair_apk.py fixtures/field-route/field-route-legacy.apk --android 16 --workbench $base --output evidence/local-rule --tap 'Open south route' --expect 'Inspect the pump seal'
                $verificationExit = $LASTEXITCODE
                $jobs = Join-Path $env:LAZARUS_STORAGE_ROOT 'data/jobs'
                if (Test-Path -LiteralPath $jobs) {
                  Get-ChildItem -LiteralPath $jobs -Directory -Recurse -Filter 'probe-*' | ForEach-Object {
                    $target = New-Item -ItemType Directory -Path (Join-Path evidence $_.Name) -Force
                    Get-ChildItem -LiteralPath $_.FullName -File | Where-Object {
                      $_.Extension -in '.xml', '.png' -or $_.Name -eq 'crash.txt' -or $_.Name -like '*-observation.txt'
                    } | Copy-Item -Destination $target.FullName
                  }
                }
                if ($verificationExit -ne 0) { throw "Local-rule repair failed: $verificationExit" }
                $result = Get-Content -Raw evidence/local-rule/report.json | ConvertFrom-Json
                $newHash = (Get-FileHash evidence/local-rule/verified.apk).Hash.ToLowerInvariant()
                if ($result.tests[0].install.output -notmatch 'INSTALL_FAILED_DEPRECATED_SDK_VERSION' -or
                    $result.patch.rule -ne 'installation-floor' -or $result.export.sha256 -ne $newHash -or
                    $result.export.installed_sha256 -ne $newHash -or $result.export.verified_environment.sdk -ne 36 -or
                    $result.export.level -ne '指定操作已验证') { throw 'Local rule did not prove the expected install failure, new output identity and operation' }
                @{ rule=$result.patch.rule; downloaded_sha256=$newHash; installed_sha256=$result.export.installed_sha256; target=36; model_enabled=$false; operation='Open south route'; expected='Inspect the pump seal'; level=$result.export.level } |
                  ConvertTo-Json | Set-Content -Encoding utf8 evidence/local-rule-summary.json
              } elseif ($env:F01_REVIEW_INPUTS) {
                $check = 'review-zip-replay'
                $shell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
                $wrapper = Join-Path $env:F01_REVIEW_INPUTS '复测样本.ps1'
                $receipt = Get-Content -Raw -LiteralPath evidence/review-inputs.json | ConvertFrom-Json
                $temperatureSample = if ($receipt.temperature_sample) { $receipt.temperature_sample } else { 'P1C/P04-agent-1' }
                foreach ($item in @(
                    @{name='demo'; options=@(); status='behavior-verified'; steps=10},
                    @{name='counterexample'; options=@('-Counterexample'); status='incomplete'; steps=2},
                    @{name='heldout'; options=@('-Sample',$temperatureSample); status='behavior-verified'; steps=16})) {
                  $options = $item.options
                  $output = @(& $shell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $wrapper @options)
                  $verificationExit = $LASTEXITCODE
                  $output | Set-Content -Encoding utf8 "evidence/review-$($item.name).log"
                  if ($verificationExit -ne 0 -or !$output.Count) { throw "Review replay $($item.name) failed: $verificationExit" }
                  $reportPath = $output[-1]
                  $proof = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
                  if ($proof.status -ne $item.status -or @($proof.steps).Count -ne $item.steps -or
                      $proof.rows[0].candidate.device.installed_sha256 -ne $proof.candidate_sha256) {
                    throw "Review replay $($item.name) produced unexpected evidence"
                  }
                  Copy-Item -LiteralPath $reportPath -Destination "evidence/review-$($item.name).json"
                }
              } else {
                $arguments = '--replay-acceptance docs/validation/0.6.7-field-route-acceptance.json fixtures/field-route/field-route-legacy.apk fixtures/verified/field-route-remember-route.apk --output evidence/replay.json --log evidence/replay.log'
                $replay = Start-Process -FilePath $app -WorkingDirectory $PWD.Path -ArgumentList $arguments -WindowStyle Hidden -PassThru
                $lastProgress = ''
                while (!$replay.HasExited) {
                  if (Test-Path evidence/replay.log) {
                    $progress = Get-Content evidence/replay.log -Tail 1
                    if ($progress -ne $lastProgress) { Write-Output $progress; $lastProgress = $progress }
                  }
                  Start-Sleep -Seconds 3
                  $replay.Refresh()
                }
                $verificationExit = $replay.ExitCode
                if ($verificationExit -ne 0) { throw "Independent replay failed: $verificationExit" }
                $proof = Get-Content -Raw evidence/replay.json | ConvertFrom-Json
                if ($proof.status -ne 'behavior-verified' -or $proof.rows[0].candidate.device.installed_sha256 -ne '3cb6ce313e96d3bc997b4431cb891f293398f3f875dea8d8dce7336214a87261') { throw 'Independent replay proof did not match the frozen candidate' }
              }
            } finally {
              foreach ($name in $offlineRules) { Remove-NetFirewallRule -DisplayName $name }
            }
            @{ duration_seconds=$clock.Elapsed.TotalSeconds; prepare_attempts=$prepareAttempt; bytes=(Get-ChildItem -LiteralPath $runtime -Recurse -File | Measure-Object Length -Sum).Sum; platform='GitHub-hosted fresh Windows runner'; check=$check; verification_exit=$verificationExit; replay_exit=$replay.ExitCode; unicode_paths=$env:UNICODE_PATHS; storage=$env:LAZARUS_STORAGE_ROOT; temp=$env:TEMP } |
              ConvertTo-Json | Set-Content -Encoding utf8 evidence/summary.json
          } finally {
            Get-ChildItem -LiteralPath $env:LAZARUS_STORAGE_ROOT -Filter desktop.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item -LiteralPath $_.FullName evidence/desktop.log }
            if (!$desktop.HasExited) { Stop-Process -Id $desktop.Id }
          }
      - name: Preserve emulator diagnostics
        if: always()
        shell: pwsh
        env:
          UNICODE_PATHS: ${{ inputs.unicode_paths }}
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'lazarus-first-runtime\runtimes\android-lab'
          if ($env:UNICODE_PATHS -eq 'true') { $runtime = Join-Path $env:RUNNER_TEMP 'lazarus-first-runtime-中文 验证\runtimes\android-lab' }
          if (Test-Path -LiteralPath $runtime) {
            Get-ChildItem -LiteralPath $runtime -File | Where-Object { $_.Name -match '\.(stdout|stderr)$' } | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName (Join-Path evidence $_.Name)
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lazarus-Agent-fresh-runtime-evidence
          path: evidence/*
          if-no-files-found: error
          retention-days: 30
