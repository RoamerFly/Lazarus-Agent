name: Release Windows

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v (must equal app_version.py)
        required: true
        default: '0.6.10'
      publish:
        description: Create/update GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set isolated release storage
        shell: pwsh
        run: '"LAZARUS_STORAGE_ROOT=$env:RUNNER_TEMP\lazarus-agent-release" >> $env:GITHUB_ENV'
      - name: Resolve and verify release version
        id: release
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          $appVersion = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          if ($version -ne $appVersion) { throw "Tag/dispatch version $version does not match app_version.py $appVersion" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: pwsh
        run: .\build_desktop.ps1
      - name: Build per-user Windows installer and portable package
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path -LiteralPath $nsis)) { throw "NSIS compiler was not installed at $nsis" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\Lazarus-Agent.exe release\Lazarus-Agent-windows-x64-portable.exe
          Compress-Archive -Path dist\Lazarus-Agent.exe,installer\portable.flag -DestinationPath release\Lazarus-Agent-windows-x64-portable.zip -Force
          & $nsis "/DVERSION=${{ steps.release.outputs.version }}" "/DSOURCE_EXE=$($PWD.Path)\dist\Lazarus-Agent.exe" "/DOUTPUT=$($PWD.Path)\release\Lazarus-Agent-windows-x64-setup.exe" installer\Lazarus-Agent.nsi
          if ($LASTEXITCODE) { throw "NSIS 构建失败，退出码：$LASTEXITCODE" }
      - name: Sign update manifest
        shell: pwsh
        env:
          LAZARUS_UPDATE_PRIVATE_KEY: ${{ secrets.LAZARUS_UPDATE_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LAZARUS_UPDATE_PRIVATE_KEY)) { throw 'Missing LAZARUS_UPDATE_PRIVATE_KEY release secret.' }
          $key = Join-Path $env:RUNNER_TEMP 'lazarus-update-private.pem'
          [System.IO.File]::WriteAllText($key, $env:LAZARUS_UPDATE_PRIVATE_KEY, [System.Text.UTF8Encoding]::new($false))
          python tools\release_manifest.py --version '${{ steps.release.outputs.version }}' --published-at (Get-Date).ToUniversalTime().ToString('o') --base-url 'https://github.com/RoamerFly/Lazarus-Agent/releases/download/v${{ steps.release.outputs.version }}' --private-key $key --out release --notes 'Windows 下载建议：常规电脑下载 Setup 安装包；需免安装或移动存放时下载 portable ZIP，解压后保留 portable.flag。' --asset windows-x64-portable-exe=release\Lazarus-Agent-windows-x64-portable.exe --asset windows-x64-installer=release\Lazarus-Agent-windows-x64-setup.exe
          Remove-Item -LiteralPath $key -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Lazarus-Agent-windows-${{ steps.release.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.release.outputs.version }}'
          $notes = "Windows 下载建议：`n- 常规使用：下载 Lazarus-Agent-windows-x64-setup.exe。`n- 免安装或移动存放：下载 portable ZIP，解压后保留 portable.flag。`n`n更新包先校验 Ed25519 签名和 SHA-256；APK 修复仍需在目标设备复测。"
          if ($tag -eq 'v0.6.7') {
            $notes = "对话候选支持逐系统的独立行为验收，保留基准、候选和设备安装哈希。桌面程序可按下载的报告离线复测。实验失败后，回滚到已构建的相同文件内容可以继续交付候选。" + [Environment]::NewLine + [Environment]::NewLine + $notes
          }
          if ($tag -eq 'v0.6.8') {
            $notes = "回编前检查 SDK 声明的位置，为模型返回具体的清单修改错误。保留候选独立验收、成功构建回滚及桌面离线复测能力。" + [Environment]::NewLine + [Environment]::NewLine + $notes
          }
          if ($tag -eq 'v0.6.9') {
            $notes = "修复中文临时目录下模拟器路径桥接失败的问题。助手会为本次模拟器进程选择可写的工具临时目录。保留通用 APK 改造和独立行为验收能力。" + [Environment]::NewLine + [Environment]::NewLine + $notes
          }
          if ($tag -eq 'v0.6.10') {
            $notes = "独立验收在启动命令成功后，有限等待目标应用界面出现，并记录各次观察。未观察到目标应用时仍拒绝通过。保留中文目录支持、通用 APK 改造与离线复测。" + [Environment]::NewLine + [Environment]::NewLine + $notes
          }
          if ($tag -eq 'v0.6.5') {
            $notes = "修复对话新增页面方向改造。启用模型后，可用一句话指定横屏、竖屏或跟随系统，模型会读取页面清单并调用本地工具生成签名候选。" + [Environment]::NewLine + [Environment]::NewLine + $notes
          }
          if ($tag -eq 'v0.6.6') {
            $notes = "修复对话改用通用 Agent 工具。模型能根据需求搜索和阅读 APK 内容、修改代码及资源、回编签名并在专用设备上测试。后续对话可以从最新候选继续。" + [Environment]::NewLine + [Environment]::NewLine + $notes
          }
          if ($tag -eq 'v0.3.0') {
            $notes = "工作台新增模型配置和工具调用测试。启用后，修复助手可按故障查询隔离设备的共享库，并在重签名后复测候选 APK。默认使用本地规则。`n`n" + $notes
          }
          if ($tag -eq 'v0.4.0') {
            $notes = "新增通用功能改造工作流。可验证旧应用是否记住上次打开的文件，并支持扫描、选择和验收简体中文资源改造。改造候选仍须在所选 Android 版本逐项复测。`n`n" + $notes
          }
          if ($tag -eq 'v0.5.0') {
            $notes = "在修复对话输入「汉化成中文」即可分析 APK、补字并下载签名候选。支持普通 Android 字符资源及 Unity 4 NGUI 的部分语言表和位图字库。离线词库默认开启，模型补译可选。已用《环太平洋》和 OI 记事本做入口回归。" + [Environment]::NewLine + [Environment]::NewLine + $notes
          }
          if ($tag -eq 'v0.5.1') {
            $notes = "对话汉化新增 Java 索引文本表识别、缓存更新和 GHL 位图字库补字，已用《恐龙战争》原包回测。" + [Environment]::NewLine + $notes
          }
          if (gh release view $tag 2>$null) {
            gh release upload $tag release/* --clobber
            gh release edit $tag --notes $notes
          } else {
            gh release create $tag release/* --title "Lazarus Agent $tag" --notes $notes --target '${{ github.sha }}'
          }
